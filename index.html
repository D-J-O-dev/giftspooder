 $("nx").style.display="";$("nx").textContent=pi>=parts.length-1?(onEnd?"Continue ▶":"Got it ▶"):"Next ▶";$("pc").textContent=parts.length>1?(pi+1)+"/"+parts.length:"";
 typing=setInterval(()=>{k++;if(k%4==0)beep(1100,.015,"square",.012);cap.textContent=full.slice(0,k);if(k>=full.length)clearInterval(typing)},1000/(CONFIG.captionSpeed||28))}
function speak(call,cb,who){lastCall=call;onEnd=cb||null;parts=splitParts(call.text);pi=0;$("who").textContent="● "+(who||CONFIG.caller);showPart()}
function nextPart(){if(!parts.length)return;const cap=$("cap");
 if(cap.textContent.length<full.length){clearInterval(typing);cap.textContent=full;return}
 if(pi<parts.length-1){pi++;showPart();return}
 clearInterval(typing);$("nx").style.display="none";const f=onEnd;onEnd=null;if(f)f()}
$("nx").onclick=()=>{sfx.click();nextPart()};
$("rp").onclick=()=>{if(lastCall&&!onEnd){pi=0;showPart()}};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&$("nx").style.display!=="none")nextPart()});

/* toast + map */
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3800)}
const NODES=[["ROOFTOPS",25,18],["ENTRANCE",25,58],["SECURITY HUB",95,58],["ELEVATOR",95,100],["ARCHIVE F8",155,100],["VAULT",165,34]];
let mapLoc=0;
function drawMap(loc,animate){mapLoc=loc;let h='<rect x="3" y="3" width="194" height="144" fill="none" stroke="#2a4a8a"/><rect x="12" y="44" width="110" height="28" fill="#e6242922" stroke="#e62429" stroke-dasharray="3"><title>Security zone</title></rect>';
 for(let i=0;i<5;i++){const a=NODES[i],b=NODES[i+1],d=i<loc;h+=`<line x1="${a[1]}" y1="${a[2]}" x2="${b[1]}" y2="${b[2]}" stroke="${d?"#6fe39a":"#2a4a8a"}" stroke-width="${d?3:2}" stroke-dasharray="${d?"0":"4"}"/>`}
 NODES.forEach((n,i)=>{const open=i<=loc,next=i===loc+1;h+=`<circle cx="${n[1]}" cy="${n[2]}" r="5" fill="${open?"#6fe39a":next?"#ffcc33":"#0b1736"}" stroke="${next?"#ffcc33":"#4fd1ff"}"${next?' class="pl"':''}/><text x="${n[1]+(n[1]>140?-8:8)}" y="${n[2]+(i==5?-8:3)}" font-size="7" fill="#9cc4ff" text-anchor="${n[1]>140?"end":"start"}">${i>0?(open?"🔓 ":"🔒 "):""}${n[0]}</text>`});
 h+=`<g id="sp" style="transition:transform 1.6s ease-in-out;transform:translate(${NODES[loc][1]}px,${NODES[loc][2]}px)"><circle r="7" fill="#e62429" opacity=".35"/><text y="4" font-size="11" text-anchor="middle">🕷</text></g>`;
 $("msvg").innerHTML=h;$("st").textContent="● "+["ALERT","ALERT","CAUTION","CAUTION","LOW POWER","VAULT"][loc];$("st").style.color=loc<2?"#ff6b6b":loc<4?"#ffcc33":"#6fe39a";
 if(animate!==undefined){const sp=$("sp");sp.style.transition="none";const f=NODES[animate];sp.style.transform=`translate(${f[1]}px,${f[2]}px)`;sp.getBoundingClientRect();sp.style.transition="";sp.style.transform=`translate(${NODES[loc][1]}px,${NODES[loc][2]}px)`}}
function setProg(){$("prog").textContent=`MISSION ${Math.min(S.lvl+1,total)}/${total}`}

/* terminal log */
async function bootLog(el,lines){for(const l of lines){el.innerHTML+=esc(l)+"<br>";await sleep(220)}}
const LOGS=[["> LINK ESTABLISHED","> WARNING: INTRUDER DETECTED IN PERIMETER","> DOOR LOCK: ENGAGED"],["> CAMERA GRID ONLINE (4/4)","> WARNING: TARGET TRACKING ACTIVE","> LOCK: PASSWORD REQUIRED"],["> ELEVATOR CTRL: LOCKED","> DESTINATION REGISTER: ENCRYPTED","> AWAITING INPUT"],["> ARCHIVE POWER: 0%","> WARNING: BACKUP RELAY OFFLINE","> MAINTENANCE CMD: ENCODED"],["> VAULT CONTROLLER: PASSWORD UNKNOWN","> SECURITY SCRIPT: ENCRYPTED","> AWAITING OVERRIDE"]];

/* generic puzzles (levels 1-4) */
function startLevel(i,first){S.lvl=i;save();setProg();const L=CONFIG.levels[i];
 {const c=document.createElement("div");c.className="card";c.innerHTML=`<span class="or">MISSION ${i+1} / ${total}</span><b>${esc(L.title)}</b>`;document.body.appendChild(c);setTimeout(()=>c.remove(),2300);beep(330,.15,"sawtooth",.05)}
 drawMap(L.loc,i?CONFIG.levels[i-1].loc:undefined);
 const play=()=>speak(L,null);$("cap").textContent="";$("pc").textContent="";$("nx").style.display="none";
 setTimeout(()=>{if(first&&i===0)speak(CONFIG.intro,play);else play()},1900);
 if(L.py)return pyLevel(L);
 const T=$("term");
 T.innerHTML=`<h2 style="color:var(--red);margin:0">LEVEL ${i+1} — ${L.title}</h2><div class="log" id="lg"></div>
 <p><b>OBJECTIVE:</b> ${esc(L.obj)}</p><div class="or" style="font-size:.7rem;color:var(--cyan)">INTERCEPTED TRANSMISSION · ENCODING: ${L.type}</div><div class="cipher">${esc(L.cipher)}</div>
 <p style="opacity:.85">${esc(L.explain)}</p><div class="row"><input id="ans" placeholder="Type the decoded password..." autocomplete="off" autofocus><button id="sub">Submit</button>${CONFIG.showHints?'<button id="hint">Hint</button>':""}</div><div class="msg" id="m"></div><div id="pw"></div>`;
 bootLog($("lg"),LOGS[i]);let hn=0;setTimeout(()=>{const a=$("ans");if(a&&!matchMedia("(pointer:coarse)").matches)a.focus()},400);
 const check=()=>{const v=$("ans").value.trim();sfx.click();
  if(v.toUpperCase()===L.answer.toUpperCase()){$("ans").disabled=true;$("sub").disabled=true;sfx.ok();$("m").innerHTML='<span class="ok">ACCESS GRANTED</span>';return L.power?power(L,i):solved(i)}
  sfx.bad();$("m").innerHTML='<span class="bad">'+esc(feedback(L,v))+'</span>'};
 $("sub").onclick=check;$("ans").onkeydown=e=>{if(e.key==="Enter")check()};
 if($("hint"))$("hint").onclick=()=>{$("m").innerHTML='💡 '+esc(L.hints[Math.min(hn++,L.hints.length-1)])+(hn<L.hints.length?" (press Hint again for a bigger clue)":"")}}
function feedback(L,v){if(!v)return"Type your decoded answer first. Use the explanation above if you're stuck.";
 if(v.replace(/\s/g,"")===L.cipher.replace(/\s/g,""))return"That's still the encrypted text. Decode it into plain letters first.";
 if(v.length!==L.answer.length)return`Not quite. The decoded password has ${L.answer.length} characters; yours has ${v.length}. Check you decoded every part.`;
 let ok=0;[...v.toUpperCase()].forEach((c,k)=>{if(c===L.answer.toUpperCase()[k])ok++});return`Close — ${ok} of ${L.answer.length} characters are in the right place. Re-check the others.`}
async function solved(i){const L=CONFIG.levels[i];toast(L.radio);await sleep(900);
 const html=[`<div class="big">ACCESS GRANTED</div><div class="doors"><i></i><i></i></div><div>MAIN DOORS UNLOCKED</div>`,
 `<div class="big">CAMERAS DISABLED</div><div class="cams"><span class="cam"></span><span class="cam"></span><span class="cam"></span><span class="cam"></span></div>`,
 `<div class="big">ELEVATOR ONLINE</div><div class="or" style="font-size:3rem" id="fl">FLOOR 1</div><div>ASCENDING...</div>`,
 `<div class="big">POWER RESTORED</div>`][i];
 const o=$("ov");o.className="show";o.innerHTML=html;
 if(i===2)for(let f=1;f<=8;f++){$("fl").textContent="FLOOR "+f;beep(300+f*60,.1);await sleep(330)}
 await sleep(2200);o.className="";o.innerHTML="";startLevel(i+1)}
function power(L,i){$("pw").innerHTML=`<p class="ok">Command accepted: <b>${L.answer}</b>. Backup relay found. Activate it to restore power:</p><button class="sw" id="sw">⏻ OFF</button>`;
 $("sw").onclick=async()=>{$("sw").textContent="⏻ ON";$("sw").style.background="var(--red)";sfx.glitch();$("term").classList.add("flick");await sleep(1000);$("term").classList.remove("flick");solved(i)}}

/* LEVEL 5 — four stages */
const hl=c=>esc(c).replace(/\b(def|if|return)\b/g,'<span class="k">$1</span>').replace(/(&quot;.*?&quot;)/g,'<span class="s">$1</span>').replace(/(open_vault)/g,'<span class="f">$1</span>');
function pyLevel(L){const T=$("term"),enc=rot13(CONFIG.pyCode);
 T.innerHTML=`<h2 style="color:var(--red);margin:0">LEVEL 5 — ${L.title}</h2><div class="log" id="lg"></div><p><b>STAGE 1/4 — DECRYPT.</b> The vault's security script is encrypted. Identify the cipher, then decode it.</p><pre class="code" id="enc">${esc(enc)}</pre>
 <div class="row" id="opts">${["HEXADECIMAL","ROT13","BASE64","BINARY"].map(c=>`<button data-c="${c}">${c}</button>`).join("")}${CONFIG.showHints?'<button id="hint">Hint</button>':""}</div><div class="msg" id="m"></div>`;
 bootLog($("lg"),LOGS[4]);
 if($("hint"))$("hint").onclick=()=>$("m").textContent="💡 ROT13 shifts each letter 13 places (A↔N). Notice the code words look like gibberish but keep their shape: 'qrs' is 'def'. Python keywords appear once decoded.";
 $("opts").onclick=async e=>{const c=e.target.dataset.c;if(!c)return;sfx.click();
  if(c!=="ROT13"){sfx.bad();$("m").innerHTML='<span class="bad">'+({HEXADECIMAL:"Hex only uses 0-9 and A-F, and this text has normal letters beyond F.",BASE64:"Base64 looks like one dense blob without spaces or punctuation like this.",BINARY:"Binary is only 0s and 1s."}[c])+" Try another cipher.</span>";return}
  sfx.ok();$("opts").innerHTML="";$("m").innerHTML='<span class="ok">ROT13 confirmed. Decrypting...</span>';
  for(let k=0;k<=enc.length;k+=4){$("enc").textContent=CONFIG.pyCode.slice(0,k)+enc.slice(k);await sleep(30)}
  $("enc").innerHTML=hl(CONFIG.pyCode);await sleep(900);stage2()}}
function stage2(){const T=$("term");
 T.innerHTML=`<h2 style="color:var(--red);margin:0">LEVEL 5 — PYTHON SECURITY OVERRIDE</h2><p><b>STAGE 2/4 — CHANGE THE PASSWORD.</b><br>The vault's current password is unknown. But we have access to its security script. Change the password to anything you want.</p>
 <p style="color:var(--cyan)">Edit the highlighted line. Replace <code>"UNKNOWN"</code> with your own password. Text in Python must stay inside quotation marks, like <code>password = "SPIDERGIRL"</code>. Letters, numbers and symbols are all fine. <b>Remember it — you'll need it!</b></p>
 <textarea class="code" id="ed" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">${esc(CONFIG.pyCode)}</textarea>
 <div class="row"><button id="up" style="font-size:1rem">Upload security patch</button>${CONFIG.showHints?'<button id="hint">Hint</button>':""}</div><div class="bar"><b id="pb"></b></div><div class="msg" id="m"></div>`;
 if($("hint"))$("hint").onclick=()=>$("m").textContent='💡 Click the highlighted line and change only the word between the quotes. = assigns a value; == compares two values (leave that part alone).';
 $("up").onclick=async()=>{sfx.click();const r=checkPatch($("ed").value);if(!r.pw){sfx.bad();$("m").innerHTML='<span class="bad">'+esc(r.m)+'</span>';return}
  $("up").disabled=true;$("ed").disabled=true;$("m").textContent="UPLOADING SECURITY PATCH...";$("pb").style.width="100%";await sleep(2600);
  S.pw=r.pw;sfx.ok();$("m").innerHTML='<div class="big" style="font-size:1.4rem">SECURITY SYSTEM UPDATED</div><div class="ok" style="margin-top:8px">NEW ACCESS CREDENTIALS ACTIVE</div>';
  speak(CONFIG.levels[4].patched,vault)}}
function checkPatch(src){const L=src.replace(/[“”„‟]/g,'"').replace(/[‘’‚‛]/g,"'").replace(/\r/g,"").split("\n"),i=L.findIndex(l=>/^\s*password\b/.test(l));
 if(i<0)return{m:"I can't find the line that starts with  password =  . Don't delete it — change only the text inside the quotes."};
 const line=L[i].trim(),m=line.match(/^password\s*=\s*(?:"([^"]*)"|'([^']*)')$/);
 if(!m){if(/^password\s*=\s*$/.test(line))return{m:"SyntaxError: nothing is assigned. Write a password in quotes, e.g. password = \"SPIDERGIRL\"."};
  if(/^password\s*=\s*[^"']/.test(line))return{m:"SyntaxError: a password is text, so it must be inside quotation marks. Try: password = \""+line.replace(/^password\s*=\s*/,"").replace(/["']/g,"")+"\""};
  return{m:"SyntaxError: unterminated string. Make sure the password has an opening AND closing quotation mark."}}
 if(/^\s/.test(L[i]))return{m:"IndentationError: the password line must start at the very left edge."};
 const pw=m[1]!==undefined?m[1]:m[2];
 if(!pw.trim())return{m:"The password can't be empty. Type something between the quotes."};
 if(pw==="UNKNOWN")return{m:"That's still the old password. Replace UNKNOWN with something of your own."};
 if(pw.length>40)return{m:"That password is too long for the vault keypad (40 characters max)."};
 const rest=L.filter((_,k)=>k!==i).join("\n");
 if(!/def open_vault\(key\):/.test(rest)||!/^\s+if key == password:\s*$/m.test(rest)||!/return "ACCESS GRANTED"/.test(rest)||!/return "ACCESS DENIED"/.test(rest))
  return{m:"Warning: the rest of the script was altered. The check  if key == password:  must stay exactly as it was. Only the password line should change."};
 return{pw}}

/* stage 4 — vault door */
function vault(){const o=$("ov");o.className="show vault";
 o.innerHTML=`<div class="big">VAULT ACCESS REQUIRED</div><svg class="vd" id="vd" viewBox="0 0 200 200"><defs><radialGradient id="vg"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#ff9d2e" stop-opacity=".15"/></radialGradient></defs><circle cx="100" cy="100" r="95" fill="url(#vg)"/><g class="h hl"><path d="M100 5A95 95 0 0 0 100 195Z" fill="#0b1736" stroke="#e62429" stroke-width="4"/></g><g class="h hr"><path d="M100 5A95 95 0 0 1 100 195Z" fill="#0b1736" stroke="#e62429" stroke-width="4"/></g><g class="sp"><circle cx="100" cy="100" r="60" fill="none" stroke="#4fd1ff" stroke-width="3" stroke-dasharray="8 6"/><path d="M100 40V160M40 100H160M58 58L142 142M142 58L58 142" stroke="#4fd1ff" stroke-width="3"/></g><circle class="ctr" cx="100" cy="100" r="16" fill="#e62429"/></svg>
 <div class="row" style="width:min(420px,90vw)"><input id="vp" type="password" placeholder="Enter the password you created..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button id="eye">👁</button><button id="vgo">Unlock</button></div><div class="msg or" id="vm"></div>`;
 drawMap(5,4);$("vp").focus();
 $("eye").onclick=()=>$("vp").type=$("vp").type==="password"?"text":"password";
 const go=async()=>{sfx.click();if($("vp").value.replace(/[“”„‟]/g,'"').replace(/[‘’‚‛]/g,"'")===S.pw){$("vm").innerHTML='<span class="ok">IDENTITY VERIFIED</span>';sfx.ok();$("vp").disabled=true;
   $("vd").classList.add("open");[200,500,900,1300].forEach(t=>setTimeout(()=>sfx.glitch(),t));await sleep(3200);S.lvl=0;save();finale()}
  else{sfx.bad();$("vm").innerHTML='<span class="bad">ACCESS DENIED — CREDENTIALS DO NOT MATCH</span>';$("vp").classList.add("shake");setTimeout(()=>$("vp").classList.remove("shake"),400);
   $("vm").innerHTML+='<div style="font-size:.75rem;color:var(--tx)">Passwords are case-sensitive. Use the exact text you typed between the quotes.</div>'}};
 $("vgo").onclick=go;$("vp").onkeydown=e=>{if(e.key==="Enter")go()}}

/* FINAL REVEAL */
async function finale(){const o=$("ov");o.className="show fin";o.innerHTML='<div class="big" id="fx"></div>';$("game").style.display="none";
 const say=async t=>{$("fx").textContent=t;$("fx").style.animation="none";$("fx").offsetWidth;$("fx").style.animation="";beep(440,.1);await sleep(1900)};
 await sleep(800);for(const t of["OBJECT RECOVERED.","ANALYZING CONTENTS...","THREAT LEVEL: NONE.","OBJECT CLASSIFICATION: PRICELESS."])await say(t);
 $("game").style.display="";$("game").style.visibility="hidden";
 o.innerHTML='<div class="or" style="font-size:1.2rem;color:var(--cyan)">A DIGITAL LETTER HAS BEEN FOUND...</div><div id="fcap" style="max-width:520px;min-height:4em"></div>';
 {$("fcap").textContent=CONFIG.final.text;const b=document.createElement("button");b.textContent="Continue ▶";b.style.marginTop="12px";$("fcap").after(b);await new Promise(r=>b.onclick=r);b.remove()}await sleep(300);
 document.body.classList.add("warm");sfx.ok();
 o.innerHTML=`<div class="big" style="color:var(--red)">HAPPY BIRTHDAY, ${esc(CONFIG.recipient.trim().toUpperCase())}!</div>
 <div class="letter">${CONFIG.birthdayMessage.map(p=>`<p>${esc(p)}</p>`).join("")}<p style="text-align:right">— ${esc(CONFIG.from)}</p></div>
 <p style="max-width:520px;color:var(--cyan)">${esc(CONFIG.spiderThanks)}</p><div class="row" style="justify-content:center"><button id="vo">Read final message</button><button id="rpy">Replay adventure</button></div><div id="fcap2" style="max-width:520px"></div>`;
 confetti();$("vo").onclick=()=>{$("fcap2").textContent=CONFIG.outro.text;$("vo").disabled=true};
 $("rpy").onclick=()=>{S.lvl=0;S.pw=null;save();location.reload()}}
function confetti(){const c=$("cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:110},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,v:1+Math.random()*2.5,r:2+Math.random()*4,h:Math.random()*60+20}));let t=0;
 (function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/30);if(p.y>c.height)p.y=-10;x.fillStyle=`hsl(${p.h},95%,65%)`;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(t++<1500&&!matchMedia("(prefers-reduced-motion:reduce)").matches)requestAnimationFrame(f)})()}

/* skyline + boot */
(function(){let h='<svg viewBox="0 0 1000 200" preserveAspectRatio="none" width="100%" height="100%">',x=0,r=7;while(x<1000){r=(r*9301+49297)%233280;const w=30+r%50,ht=40+r%150;h+=`<rect x="${x}" y="${200-ht}" width="${w}" height="${ht}" fill="#070d22" stroke="#1a2a5a"/>`;for(let k=0;k<ht/16;k++)if((r+k)%3==0)h+=`<rect x="${x+5+(k*7%w)}" y="${200-ht+6+k*14}" width="4" height="5" fill="#ffd98a" opacity=".5"/>`;x+=w+4}$("sky").innerHTML=h+"</svg>"})();
(async function(){const t=$("lt");await sleep(3200);for(const l of CONFIG.loading){t.textContent=l;await sleep(1500)}
 $("load").classList.add("glitch");$("go").style.display="";const begin=()=>{initAudio();sfx.click();$("load").style.display="none";$("game").style.display="";startLevel(S.lvl,true)};$("go").onclick=begin;
 if(S.lvl>0){$("go").textContent="Continue — mission "+(S.lvl+1);const n=$("new");n.style.display="";n.onclick=()=>{S.lvl=0;save();begin()}}})();
</script></body></html>
